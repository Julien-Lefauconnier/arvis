[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arvis"
version = "0.1.0b5"
description = "Cognitive Operating System kernel for trustworthy AI systems"
readme = "README.md"
requires-python = ">=3.11"

authors = [
  { name="Julien Lefauconnier", email="admin@veramem.com" }
]

license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

keywords = [
  "ai",
  "cognitive-os",
  "agentic-ai",
  "reasoning",
  "uncertainty",
  "memory",
  "governance",
  "ai-safety"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  # Minimum bounds are the versions actually proven by the gate
  # (audit a14, A14-P1-07): the locked environment for jsonschema and
  # numpy, and pydantic 2.8 which the beta-manifest determinism proof
  # exercises explicitly alongside the locked 2.13. Widening a bound
  # is deliberate and requires proving the older version in the gate
  # first.
  #
  # Every bound is capped at the next major (campaign CI). This
  # library's central claim is deterministic, reproducible execution,
  # and a major release of a numeric or validation dependency can move
  # that ground under a consumer who only ran `pip install arvis`:
  # numpy 1 to 2 was breaking, and the published artifacts already
  # carry a cross-platform ulp correction. A cap is a deliberate,
  # visible upgrade rather than an automatic one.
  "jsonschema>=4.26,<5",
  "pydantic>=2.8,<3",
  # numpy 2.4.0 was yanked from the index; 2.4.1 is the lowest
  # installable revision of the proven series (audit a15, 7.4).
  "numpy>=2.4.1,<3",
]

[project.optional-dependencies]
dev = [
  # Gate tools are pinned exactly: the repository's canonical formatting and
  # security thresholds are defined by these versions, and results must be
  # reproducible between local gates and CI (audit 0.1.0a4, tooling
  # reproducibility).
  # Bumping any pin is a deliberate, dedicated commit (re-format if ruff).
  "mypy==1.19.1",
  "ruff==0.14.3",
  "pytest==8.4.2",
  "bandit==1.9.4",
  # Plugins pinned with the gate lockfile (audit a13, P1-03): the full
  # transitive environment is frozen in requirements/gate.lock, and CI
  # installs from the lock.
  "types-jsonschema==4.26.0.20260518",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  "hypothesis==6.161.2",
  "pytest-benchmark==5.3.0",
  "pytest-asyncio==1.4.0",
  # Read by the compliance scenario loader only (compliance/ is
  # excluded from the wheel), so it is gate tooling and not a runtime
  # dependency: shipping it made every consumer install a C extension
  # that arvis/ never imports (campaign CI).
  "pyyaml>=6.0.3",
]

openai = ["openai>=1.0"]
llm = [
  "openai>=1.0",
  "anthropic",
  "ollama",
]

[project.urls]
Homepage = "https://github.com/Julien-Lefauconnier/arvis"
Repository = "https://github.com/Julien-Lefauconnier/arvis"
Documentation = "https://github.com/Julien-Lefauconnier/arvis/tree/main/docs"
Issues = "https://github.com/Julien-Lefauconnier/arvis/issues"
Changelog = "https://github.com/Julien-Lefauconnier/arvis/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["arvis*"]

[tool.setuptools.package-data]
arvis = ["py.typed"]
# The versioned consumer contract ships with the package (a16).
"arvis.api.contracts" = ["*.schema.json"]
"arvis.api" = ["schema/*.json"]

[tool.mypy]
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "openai", "openai.*",
  "anthropic", "anthropic.*",
  "ollama", "ollama.*"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests", "compliance"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = ["error"]

asyncio_mode = "auto"
