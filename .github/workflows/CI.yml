name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-type:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install deps
        run: |
          pip install --upgrade pip
          # Locked gate environment (audit a13, P1-03): the full
          # transitive set is frozen; the package itself installs on top
          # without resolving anything.
          pip install -r requirements/gate.lock --prefer-binary
          pip install -e . --no-deps

      - name: Fail on missing __all__
        run: python -c "import arvis; assert hasattr(arvis, '__all__') and arvis.__all__"

      - name: Static gate (format, lint, types, docs, headers, excepts)
        # The gate script owns every check exactly once; this job
        # selects the mode. Hand-copying the commands here is what let
        # the broad-except ratchet exist in the gate and in no
        # workflow (campaign CI), and the parity is now pinned by
        # tests/tooling/test_ci_gate_parity.py.
        run: bash scripts/run_quality_gate.sh static

      - name: Dependency audit
        # Known vulnerabilities in the resolved dependency set. Blocking
        # since a14 (audit a13, P1-03): the environment is locked, so a
        # failure here is actionable, never noise from unrelated work.
        run: |
          pip install pip-audit==2.10.1
          # Blocking (audit a13, P1-03). Exceptions, if ever needed, are
          # explicit --ignore-vuln flags added here with a dated
          # justification, per the policy in SECURITY.md.
          #
          # PYSEC-2026-1845 (pytest 8.4.2, fixed in 9.0.3), ignored
          # 2026-07-24: pytest is gate tooling only, absent from the
          # shipped wheel and from the runtime dependencies. The fix is
          # the pytest 9 toolchain bump already opened by Dependabot.
          # Keep it as a dedicated tooling change rather than mixing a
          # formatter/test-runner transition into a corrective release.
          # Remove this flag with that bump.
          pip-audit --strict -r requirements/gate.lock --ignore-vuln PYSEC-2026-1845

      - name: Bandit (medium/high)
        run: bash scripts/run_quality_gate.sh security

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install deps
        run: |
          pip install --upgrade pip
          # Locked gate environment (audit a13, P1-03): the full
          # transitive set is frozen; the package itself installs on top
          # without resolving anything.
          pip install -r requirements/gate.lock --prefer-binary
          pip install -e . --no-deps

      - name: Tests gate (suite, coverage floor, per-package floors)
        # The aggregate floor let a 59%-covered gate-policy module hide
        # inside a 91% total; the decisive packages carry their own
        # ratcheting floors (audit G4 / MATH-A M3). Both live in the
        # gate script, which this job selects.
        run: bash scripts/run_quality_gate.sh tests

      - name: Coverage XML for Codecov
        if: matrix.python-version == '3.11'
        run: python -m coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5

  min-deps:
    # Minimum supported dependencies (audit a15, 7.4): the published
    # lower bounds are installed exactly and the full suite runs on the
    # most constrained interpreter. The locked jobs above remain the
    # primary gate; this one keeps the public bounds honest, so a
    # future change cannot break the minima undetected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install minimum runtime bounds and pinned test tools
        run: |
          pip install --upgrade pip
          pip install "jsonschema==4.26.0" "pyyaml==6.0.3" \
            "pydantic==2.8.0" "numpy==2.4.1"
          pip install "pytest==8.4.2" "pytest-asyncio==1.4.0" \
            "pytest-benchmark==5.2.3" "pytest-cov==7.1.0" \
            "pytest-mock==3.15.1" "hypothesis==6.161.2"
          pip install -e . --no-deps
      - name: Run the full suite on the minima
        run: pytest --maxfail=1 --disable-warnings -q

  wheel-compliance:
    # Black-box compliance against a freshly built wheel on every push
    # and pull request (audit a15, 7.5), not only at release time: a
    # packaging rupture (missing package data, broken entry point) is
    # caught when it lands, not when publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Black-box compliance against the built wheel
        run: |
          pip install --upgrade pip
          bash scripts/run_blackbox_against_wheel.sh

  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          pip install --upgrade pip
          # Locked gate environment (audit a13, P1-03): the full
          # transitive set is frozen; the package itself installs on top
          # without resolving anything.
          pip install -r requirements/gate.lock --prefer-binary
          pip install -e . --no-deps

      - name: Examples gate (stable examples smoke)
        run: bash scripts/run_quality_gate.sh examples

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tooling
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine metadata check
        run: twine check dist/*

      - name: Verify py.typed ships in the wheel
        run: python -c "import glob, zipfile; w = glob.glob('dist/*.whl')[0]; assert 'arvis/py.typed' in zipfile.ZipFile(w).namelist(), 'py.typed missing from wheel'; print('py.typed present in', w)"

      - name: Verify ir_schema.json ships in the wheel
        run: python -c "import glob, zipfile; w = glob.glob('dist/*.whl')[0]; assert 'arvis/api/schema/ir_schema.json' in zipfile.ZipFile(w).namelist(), 'ir_schema.json missing from wheel'; print('ir_schema.json present in', w)"

      - name: Reject forbidden wheel entries
        run: python scripts/check_wheel_contents.py dist/*.whl

      - name: Install built wheel in a clean env and smoke-import
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install "$(ls dist/*.whl)"
          cd /tmp
          /tmp/wheelenv/bin/python -c "import arvis; print('arvis', arvis.__version__); from arvis import ArvisEngine, CognitiveOS, CognitiveOSConfig; print('public API import OK')"
          /tmp/wheelenv/bin/python -c "import json; from importlib import resources; s = json.loads(resources.files('arvis.api').joinpath('schema/ir_schema.json').read_text(encoding='utf-8')); assert s.get('type') == 'object'; print('ir_schema.json loadable from installed wheel')"
