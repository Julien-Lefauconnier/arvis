# mkdocs.yml
#
# The documentation site: MkDocs Material serving docs/ as it is, plus
# an API reference generated by mkdocstrings from the public-surface
# docstrings (100 percent covered, pinned by
# tests/contracts/test_public_docstrings.py).
#
# Build: bash scripts/build_docs.sh (strict; the CI docs job runs the
# same script from the hash-locked requirements/docs.lock environment).
#
# Links that point above docs/ (../CONTRIBUTING.md, ../examples/...)
# are valid in the repository (check_md_refs validates every one at
# gate time) but have no target inside the site; the hook
# scripts/mkdocs_hooks.py rewrites them to the GitHub URLs at
# render time, so link validation below only has to tolerate them at
# analysis time (info, not warning). In-site wrong links still fail
# the strict build as unrecognized relative links.

site_name: ARVIS
site_description: >-
  Deterministic runtime assurance for LLM-based systems: graded
  verdicts, hashed commitments, bit-identical replay.
site_url: https://julien-lefauconnier.github.io/arvis/
repo_url: https://github.com/Julien-Lefauconnier/arvis
repo_name: Julien-Lefauconnier/arvis
edit_uri: blob/main/docs/

docs_dir: docs
strict: true

validation:
  nav:
    omitted_files: info
  links:
    not_found: info
    unrecognized_links: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            members_order: source
            show_signature_annotations: true
            separate_signature: true

